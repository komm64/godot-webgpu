name: komm64 WebGPU Web Build

# Builds the WebGPU web export template (manual dispatch, or a release tag).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build.
        required: true
        default: '4.7'
      target:
        description: Web export template target.
        required: true
        type: choice
        default: template_debug
        options:
          - template_debug
          - template_release
      disable_3d:
        description: Strip the 3D renderer (disable_3d=yes). For 2D-only web apps (pixtube); removes the scene_forward shader whose 9-10 SSBOs exceed WebGPU's limit-8 on Mac/Firefox. Default no keeps the shared template unchanged.
        required: false
        type: choice
        default: 'no'
        options:
          - 'no'
          - 'yes'
      threads:
        description: Build with threads (threads=yes), e.g. for apps whose GDExtensions use threads.
        required: false
        type: choice
        default: 'no'
        options:
          - 'no'
          - 'yes'
      extra_scons:
        description: Extra SCons arguments, e.g. linkflags=--profiling-funcs to keep wasm function names for profiling.
        required: false
        default: ''
  push:
    tags:
      - 'v*-webgpu*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}|${{ github.ref_name }}|${{ inputs.ref || '' }}|${{ inputs.target || '' }}|${{ inputs.threads || '' }}
  cancel-in-progress: true

# dev_mode / production はターゲット別 (Compilation ステップで付与):
#   template_debug   → dev_mode=yes (アサーション込み、iPad 調査用)
#   template_release → production=yes (最適化 + アサーション無し)
# 旧構成は release にも dev_mode=yes が入っており、配布 wasm が
# デバッグビルド (48MB & 低速) になっていた (pixtube 2026-07-10 発覚)
env:
  EM_VERSION: 4.0.11
  SCONS_FLAGS: >-
    tests=no
    debug_symbols=no
    dlink_enabled=yes
    webgpu=yes
    opengl3=no

jobs:
  webgpu-web-template:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    name: WebGPU web template

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          submodules: recursive

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EM_VERSION }}
          no-cache: true

      - name: Verify Emscripten setup
        run: emcc -v

      # The precompiled WGSL table is keyed by a hash of the SPIR-V bytes, so it
      # only matches at runtime when built with the same glslang the engine
      # bundles (thirdparty/glslang), not a distro package.
      - name: Build glslangValidator matching thirdparty/glslang (WGSL precompile)
        run: |
          rev=$(awk '/^## glslang/{f=1} f&&/^- Version:/{if (match($0,/[0-9a-f]{40}/)) print substr($0,RSTART,RLENGTH); exit}' thirdparty/README.md)
          echo "glslang $rev"
          git init -q /tmp/glslang && git -C /tmp/glslang fetch -q --depth 1 https://github.com/KhronosGroup/glslang.git "$rev" && git -C /tmp/glslang checkout -q FETCH_HEAD
          cmake -S /tmp/glslang -B /tmp/glslang/build -DCMAKE_BUILD_TYPE=Release -DENABLE_OPT=OFF -DGLSLANG_TESTS=OFF -DBUILD_EXTERNAL=OFF > /dev/null
          cmake --build /tmp/glslang/build --target glslang-standalone -j"$(nproc)" > /dev/null
          sudo install /tmp/glslang/build/StandAlone/glslang /usr/local/bin/glslangValidator
          glslangValidator --version | head -3

      - name: Restore build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: komm64-webgpu-web-template
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ (github.event_name == 'push' || inputs.target == 'template_release') && 'production=yes' || 'dev_mode=yes' }} threads=${{ inputs.threads || 'no' }} ${{ inputs.disable_3d == 'yes' && 'disable_3d=yes' || '' }} ${{ inputs.extra_scons }}
          platform: web
          target: ${{ github.event_name == 'push' && 'template_release' || inputs.target }}

      - name: Save build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: komm64-webgpu-web-template
        continue-on-error: true

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: komm64-webgpu-web-${{ github.event_name == 'push' && 'template_release' || inputs.target }}${{ inputs.threads == 'yes' && '-threads' || '' }}
          path: bin/godot.web.${{ github.event_name == 'push' && 'template_release' || inputs.target }}.wasm32*.dlink.zip

      - name: Upload symbol maps (if any)
        uses: actions/upload-artifact@v4
        with:
          name: komm64-webgpu-web-symbols
          path: bin/**/*.symbols
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Create Release (WebGPU tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/godot.web.${{ github.event_name == 'push' && 'template_release' || inputs.target }}.wasm32*.dlink.zip
          generate_release_notes: true
